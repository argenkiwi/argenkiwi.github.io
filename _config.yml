# The Site Configuration

theme: jekyll-theme-chirpy

lang: en

timezone: Pacific/Auckland

title: Binary Spells

tagline: A blog about coding

description: >-
  A blog about coding.

url: "https://argenkiwi.github.io"

github:
  username: argenkiwi

twitter:
  username: argenkiwi

social:
  name: Leandro Peralta
  email: argenkiwi@hotmail.com
  links:
    - https://github.com/argenkiwi

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:

theme_mode: # [light | dark]

cdn:

avatar: /assets/img/avatar.png

toc: true

comments:
  provider:

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
